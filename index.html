<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="canonical" href="https://simplepaintsolutions.com/" />
  <title>Simple Paint Solutions | Residential & Commercial Painting in the Lower Mainland</title>
  <meta name="description" content="Simple Paint Solutions offers professional interior & exterior painting services for homes and businesses across the Lower Mainland. Request your free quote today.">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon.png" />

  <!-- SEO / Social Sharing -->
  <meta property="og:title" content="Simple Paint Solutions | Residential & Commercial Painting" />
  <meta property="og:description" content="Expert interior & exterior painting for homes & businesses across the Lower Mainland. Request a free quote today!" />
  <meta property="og:image" content="https://simplepaintsolutions.com/assets/images/logo.png" />
  <meta property="og:url" content="https://simplepaintsolutions.com/" />
  <meta property="og:type" content="website" />

  <!-- Fonts & Styles -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css?v=6" />
</head>

<body>

  <!-- Header include -->
  <div id="navbar"></div>
  <script defer src="assets/js/header.js?v=6"></script>

  <!-- HERO IMAGE (replaces video) -->
  <section class="hero">
    <picture>
      <!-- optional: include webp if you exported it -->
      <source srcset="assets/images/hero-banner.webp" type="image/webp" />
      <img src="assets/images/hero-banner.jpg" alt="Professional painting in British Columbia" class="hero-img" />
    </picture>

    <div class="hero-overlay">
      <h1>British Columbia's Painting Experts</h1>
      <p class="hero-pillars">Reliable · Professional · Attentive</p>
      <a href="/Contact/contact.html" class="btn primary">Get a Quote</a>
    </div>
  </section>

  <!-- Call to Action Strip -->
  <section class="quote-strip">
    <a href="/Contact/contact.html" class="quote-button large">Book Your Free Quote Today!</a>
    <span class="service-area">Serving the Lower Mainland of British Columbia.</span>
  </section>

  <!-- Services Section -->
  <section class="services-section">
    <div class="services-header">
      <h2>Our Services</h2>
      <div class="services-icon">🏠🖌️</div>
    </div>

    <div class="services-grid">
      <a href="/InteriorPainting/interior.html" class="service-box">
        <img src="assets/images/WoodwardSt2.jpg" alt="Interior Painting" />
        <span>Interior Painting</span>
      </a>
      <a href="/ExteriorPainting/exterior.html" class="service-box">
        <img src="assets/images/FrontPorchImage.png" alt="Exterior Painting" />
        <span>Exterior Painting</span>
      </a>
      <a href="/CommercialPainting/commercial.html" class="service-box">
        <img src="assets/images/PaintedOffice.png" alt="Commercial Painting" />
        <span>Commercial Painting</span>
      </a>
      <a href="/CabinetRefinishing/cabinets.html" class="service-box">
        <img src="assets/images/No4Rd1.jpg" alt="Cabinet Refinishing" />
        <span>Cabinet Refinishing</span>
      </a>
      <a href="/ExteriorCleaning/cleaning.html" class="service-box">
        <img src="assets/images/ExteriorCleaning.png" alt="Exterior Cleaning" />
        <span>Exterior Cleaning</span>
      </a>
    </div>
  </section>

  <!-- Bottom logo / CTA -->
  <section class="quote-bottom">
    <img src="assets/images/logo.png" alt="Simple Paint Solutions Logo" class="footer-logo" />
  </section>

  <!-- Footer include -->
  <div id="footer"></div>
  <script defer src="assets/js/footer.js?v=6"></script>

</body>
</html>
